name: Integration checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify.py
        env:
          LLM_API_KEY: ''
      - run: node --check app/static/app.js
      - run: node --check app/static/ui-utils.js
      - run: node --check app/static/snapshot-preview.js
      - run: node --test tests/test_ui.cjs
      - name: Server startup smoke test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/climatelens-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python scripts/smoke.py
  live-nasa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify authentic Singapore 2001-2025 observations
        run: python -m unittest discover -s tests -p test_integration.py -k test_live_singapore -v
        env:
          RUN_LIVE_NASA: '1'
          LLM_API_KEY: ''
