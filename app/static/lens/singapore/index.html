/* ---------- Discover: floating Singapore island (adapted from the team's floating-island concept page) ---------- */
.dv{--dv-ink:#10291a;--dv-ink2:#2c4434;--dv-lime:#c6f35c;--dv-lime2:#a9dd3a;--dv-sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;--dv-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;font-family:var(--dv-sans);color:var(--dv-ink);background:#e7ebe8;-webkit-font-smoothing:antialiased}
.dv *{box-sizing:border-box}
.dv button{font:inherit;color:inherit;cursor:pointer}
.dv button:focus-visible,.dv a:focus-visible{outline:2px solid #7baf1c;outline-offset:4px}
.dv-chip{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 9px;background:var(--dv-lime);color:var(--dv-ink);border:0;border-radius:3px;font:500 10.5px var(--dv-mono);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.dv-story{position:relative;height:560vh}
.dv-stage{position:sticky;top:0;height:100vh;overflow:hidden;background:#dfe3e0;isolation:isolate}
.dv-cam{position:absolute;inset:-9% -3% -3%;will-change:transform;transform-origin:50% 55%}
.dv-plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dv-cam:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(231,235,232,.18),transparent 36%,rgba(24,42,31,.05));pointer-events:none}
.dv-veil{position:absolute;inset:0;z-index:2;background:radial-gradient(70% 60% at 50% 50%,rgba(16,41,26,.08),rgba(16,41,26,.42));opacity:0;pointer-events:none}
.dv-mist{position:absolute;z-index:2;inset:-10%;pointer-events:none;background:radial-gradient(40% 30% at 20% 80%,rgba(255,255,255,.24),transparent 70%),radial-gradient(35% 25% at 85% 30%,rgba(255,255,255,.16),transparent 70%);animation:dvDrift 18s ease-in-out infinite alternate}
@keyframes dvDrift{to{transform:translate3d(4%,-2%,0)}}
.dv-fog{position:absolute;left:-8vw;top:-6vh;width:56vw;height:60vh;z-index:3;visibility:hidden;opacity:0;pointer-events:none;mask-image:radial-gradient(ellipse 52% 48% at 46% 46%,#000 44%,rgba(0,0,0,.7) 64%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 52% 48% at 46% 46%,#000 44%,rgba(0,0,0,.7) 64%,transparent 100%)}
.dv-fog:before{content:"";position:absolute;inset:-20%;background:radial-gradient(60% 55% at 40% 45%,#d9dddd,#cfd4d4 60%,#c9cfcf);filter:blur(14px);animation:dvFog 26s ease-in-out infinite alternate}
@keyframes dvFog{to{transform:translate3d(6%,3%,0) scale(1.08)}}
.dv-layer{position:absolute;inset:0;pointer-events:none}
.dv-layer>*{pointer-events:auto}
.dv-hero{z-index:5}
.dv-hero-copy{position:absolute;top:12%;left:0;right:0;text-align:center;pointer-events:none}
.dv-hero-copy h1{font-family:var(--dv-sans);font-size:clamp(52px,5.8vw,96px);font-weight:500;line-height:.92;letter-spacing:-.045em;margin:18px 0 0;color:var(--dv-ink)}
.dv-line{display:block;overflow:hidden;padding-bottom:.06em;white-space:nowrap}
.dv-line>span{display:block;animation:dvRise 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes dvRise{from{transform:translateY(105%)}to{transform:translateY(0)}}
.dv-eyebrow{position:absolute;top:29%;left:34px;display:flex;gap:9px;align-items:center;font:500 10px var(--dv-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--dv-ink2)}
.dv-eyebrow i{width:6px;height:6px;border-radius:50%;background:#4f8a12}
.dv-index{position:absolute;top:29%;right:34px;text-align:right;font:10px/1.7 var(--dv-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dv-ink2)}
.dv-map{position:absolute;z-index:7;left:5%;right:5%;top:31%;height:46%;transition:opacity .35s;pointer-events:none}
.dv-outline{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dv-outline path{fill:rgba(198,243,92,.025);stroke:rgba(255,255,255,.68);stroke-width:1.2;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;filter:drop-shadow(0 1px 2px rgba(16,41,26,.35))}
.dv-label{position:absolute;display:flex;align-items:center;gap:6px;transform:translate(-10px,-50%);border:0;background:none;padding:5px;white-space:nowrap;pointer-events:auto;transition:filter .3s,transform .3s}
.dv-label:hover,.dv-label:focus-visible{z-index:10;transform:translate(-10px,-50%) scale(1.08)}
.dv-dot{width:21px;height:21px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--dv-lime);box-shadow:0 0 0 4px rgba(198,243,92,.18),0 2px 12px rgba(16,41,26,.15);font:500 17px/1 var(--dv-sans);transition:box-shadow .3s}
.dv-label:hover .dv-dot{box-shadow:0 0 0 8px rgba(198,243,92,.24)}
.dv-place{padding:6px 8px;border:1px solid rgba(255,255,255,.58);border-radius:3px;background:rgba(245,248,242,.82);backdrop-filter:blur(10px);font:500 9px/1 var(--dv-mono);letter-spacing:.08em;text-transform:uppercase;box-shadow:0 4px 16px rgba(10,30,15,.07)}
.dv-strip{display:none}
.dv-bottom{position:absolute;z-index:8;left:34px;right:34px;bottom:33px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.dv-caption{border-left:2px solid var(--dv-lime);padding-left:16px;color:var(--dv-ink2);font:500 11px/1.75 var(--dv-mono);letter-spacing:.12em;text-transform:uppercase}
.dv-explore{display:flex;align-items:center;gap:12px;color:var(--dv-ink2);font:500 10px var(--dv-mono);letter-spacing:.14em;text-transform:uppercase;text-align:right}
.dv-circle{display:grid;place-items:center;width:22px;height:22px;border:1.3px solid currentColor;border-radius:50%}
.dv-circle:after{content:"";width:5px;height:5px;border-right:1px solid;border-bottom:1px solid;transform:translateY(-1px) rotate(45deg);animation:dvNudge 1.6s ease-in-out infinite}
@keyframes dvNudge{50%{transform:translateY(2px) rotate(45deg)}}
.dv-rock{position:absolute;z-index:4;pointer-events:none}
.dv-rk1{left:4%;top:13%;width:7.5vw;aspect-ratio:520/590}
.dv-rk3{left:80%;top:58%;width:14vw;aspect-ratio:530/540}
.dv-bob{position:absolute;inset:0;animation:dvBob 7s ease-in-out infinite alternate}
.dv-rk1 .dv-bob{animation-duration:6s}
.dv-rk3 .dv-bob{animation-duration:8.5s;animation-delay:-3s}
.dv-rock img{width:100%;height:100%;display:block}
@keyframes dvBob{from{transform:translateY(-1.2%) rotate(-1.2deg)}to{transform:translateY(1.6%) rotate(1.4deg)}}
.dv-vision{z-index:8;visibility:hidden}
.dv-vision-block{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(860px,90vw);text-align:center;color:white}
.dv-vision h2{font-family:var(--dv-sans);font-size:clamp(34px,4.6vw,70px);font-weight:500;line-height:1;letter-spacing:-.04em;margin:18px 0 20px;color:white;text-shadow:0 2px 40px rgba(10,30,15,.55),0 1px 3px rgba(10,30,15,.3)}
.dv-vision h2 span{display:inline-block}
.dv-vision p{font-size:16px;line-height:1.45;margin:0;text-shadow:0 1px 14px rgba(10,30,15,.7)}
.dv-account{z-index:8;visibility:hidden}
.dv-acct{position:absolute;left:34px;top:14vh;width:min(580px,86vw);margin:0;font-size:clamp(20px,1.9vw,29px);line-height:1.16;letter-spacing:-.02em;color:var(--dv-ink);text-shadow:0 0 24px rgba(255,255,255,.85)}
.dv-acct span{display:inline-block}
.dv-spot{position:absolute;display:flex;gap:8px;align-items:center;border:0;background:none;transform-origin:center;white-space:nowrap;padding:0}
.dv-plus{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--dv-lime);font:19px/1 var(--dv-sans);animation:dvPing 2.4s infinite}
.dv-spot-label{display:block;padding:6px 9px;border-radius:4px;background:rgba(246,248,245,.78);backdrop-filter:blur(8px);font:500 10.5px var(--dv-mono);letter-spacing:.14em;text-transform:uppercase;text-align:left}
.dv-spot em{display:block;color:#4f8a12;font-style:normal;max-height:0;opacity:0;overflow:hidden;transition:all .45s;letter-spacing:.06em;text-transform:none;font-size:11px}
.dv-spot:hover em,.dv-spot:focus-visible em{max-height:20px;opacity:1;margin-top:5px}
@keyframes dvPing{0%{box-shadow:0 0 0 0 rgba(198,243,92,.6)}70%{box-shadow:0 0 0 14px rgba(198,243,92,0)}100%{box-shadow:0 0 0 0 rgba(198,243,92,0)}}
.dv-station{z-index:8;visibility:hidden}
.dv-cred{position:absolute;left:34px;top:13vh;max-width:400px;font-size:clamp(22px,2vw,30px);font-weight:500;line-height:1.08;letter-spacing:-.025em;color:var(--dv-ink);text-shadow:0 0 24px rgba(255,255,255,.85)}
.dv-cred .dv-chip{display:flex;width:max-content;text-shadow:none;margin-bottom:14px}
.dv-card{position:absolute;left:36%;top:38vh;width:270px;padding:18px;border-radius:10px;background:rgba(40,58,44,.36);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px) saturate(1.2);color:white;transform-style:preserve-3d}
.dv-card h4{font-size:15px;font-weight:500;line-height:1.2;margin:0}
.dv-card small{display:block;margin-top:9px;font:9.5px var(--dv-mono);opacity:.75}
.dv-amount{display:inline-block;margin-top:15px;font-size:44px;font-weight:500;letter-spacing:-.04em}
.dv-unit{font:10px var(--dv-mono);letter-spacing:.08em}
.dv-gain{position:absolute;right:16px;top:96px;color:var(--dv-ink);background:var(--dv-lime);padding:5px 6px;border-radius:3px;font:9px var(--dv-mono)}
.dv-card svg{width:100%;height:70px;overflow:visible;margin-top:8px;display:block}
.dv-card footer{display:flex;justify-content:space-between;font:9px var(--dv-mono);letter-spacing:.16em;opacity:.75;background:none;border:0;padding:0;color:inherit}
.dv-feats{position:absolute;right:34px;top:30vh;width:min(420px,36vw);padding:6px 16px;border-radius:10px;background:rgba(246,248,245,.7);backdrop-filter:blur(14px)}
.dv-feat{display:grid;grid-template-columns:30px 1fr 16px;gap:8px;width:100%;padding:11px 0;background:none;border:0;border-bottom:1px solid rgba(16,41,26,.14);text-align:left;font:11px/1.45 var(--dv-mono);letter-spacing:.12em;text-transform:uppercase;transition:padding .3s,color .3s}
.dv-feat:last-child{border:0}
.dv-feat span:first-child{opacity:.6}
.dv-feat:hover,.dv-feat:focus-visible{color:#4f8a12;padding-left:6px}
.dv-feat b{transition:transform .3s;font-weight:400}
.dv-feat:hover b{transform:translateX(4px)}
.dv-prog{position:absolute;z-index:10;left:50%;bottom:22px;width:120px;height:2px;transform:translateX(-50%);background:rgba(16,41,26,.18);border-radius:2px}
.dv-prog span{display:block;width:100%;height:100%;background:var(--dv-lime2);transform:scaleX(0);transform-origin:left}
/* location close-up */
.dv-focus{position:absolute;inset:0;z-index:30;color:white;visibility:hidden;opacity:0;transition:opacity .65s,visibility .65s;pointer-events:none;overflow:hidden;background:#334239}
.dv-focus.open{visibility:visible;opacity:1;pointer-events:auto}
.dv-focus-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.dv-focus.open .dv-focus-img{transform:scale(1)}
.dv-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,25,16,.78) 0%,rgba(9,25,16,.36) 47%,rgba(9,25,16,.5) 100%),linear-gradient(0deg,rgba(9,25,16,.56),transparent 45%)}
.dv-focus-content{position:absolute;left:6%;top:22%;max-width:520px}
.dv-over{display:flex;align-items:center;gap:12px;color:white;font:10px var(--dv-mono);letter-spacing:.15em;text-transform:uppercase}
.dv-over:before{content:"";height:1px;width:28px;background:var(--dv-lime)}
.dv-focus-content h2{font-family:var(--dv-sans);color:white;font-size:clamp(48px,5.2vw,76px);line-height:.98;font-weight:500;letter-spacing:-.045em;margin:18px 0 13px}
.dv-focus-content h3{font-size:21px;font-weight:400;letter-spacing:-.01em;margin:0;color:white}
.dv-focus-content p{font-size:15px;line-height:1.55;color:rgba(255,255,255,.84);max-width:380px;margin:18px 0 0}
.dv-go{margin-top:24px;height:34px;padding:0 14px}
.dv-credit{margin-top:15px;font:9px/1.5 var(--dv-mono);letter-spacing:.02em;color:rgba(255,255,255,.8)}
.dv-credit a{text-decoration:underline;text-underline-offset:3px;color:inherit}
.dv-temp{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:min(395px,33vw);padding:24px;border:1px solid rgba(255,255,255,.35);background:rgba(18,38,25,.42);border-radius:12px;backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 16px 40px rgba(0,0,0,.08)}
.dv-temp-top{display:flex;justify-content:space-between;gap:16px;align-items:start}
.dv-temp-top span{color:var(--dv-lime);font:10px var(--dv-mono);letter-spacing:.13em;text-transform:uppercase}
.dv-temp-top span+span{font-size:23px;opacity:.85;color:white}
.dv-temp h4{font-size:22px;font-weight:500;letter-spacing:-.025em;margin:14px 0 5px;color:white}
.dv-pending{color:rgba(255,255,255,.75);font:10px/1.6 var(--dv-mono);letter-spacing:.04em}
.dv-graph{margin:22px 0 5px;border-bottom:1px solid rgba(255,255,255,.2);position:relative}
.dv-graph:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.14) 0 1px,transparent 1px 33.33%);opacity:.5}
.dv-graph svg{display:block;width:100%;height:125px;position:relative;overflow:visible}
.dv-gfill{fill:url(#dvFade)}
.dv-gline{fill:none;stroke:var(--dv-lime);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.dv-gdot{fill:white;stroke:var(--dv-lime);stroke-width:1.5;vector-effect:non-scaling-stroke}
.dv-yaxis{position:absolute;right:0;top:-16px;font:9px var(--dv-mono);color:rgba(255,255,255,.6)}
.dv-glabels{position:relative;height:14px;margin-top:9px;color:rgba(255,255,255,.62);font:9px var(--dv-mono);letter-spacing:.05em}
.dv-glabels span{position:absolute;transform:translateX(-50%)}
.dv-temp-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:15px;border-top:1px solid rgba(255,255,255,.18);font:9px/1.5 var(--dv-mono);letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.74)}
.dv-temp-foot b{font-weight:500;color:var(--dv-lime)}
.dv-focus-bottom{position:absolute;bottom:45px;left:6%;right:6%;display:flex;align-items:center;justify-content:space-between;gap:15px}
.dv-back,.dv-next{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.08);color:white;border-radius:3px;padding:13px 15px;font:10px var(--dv-mono);letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(10px);transition:background .3s}
.dv-back:hover,.dv-next:hover{background:rgba(255,255,255,.2)}
.dv-pos{font:10px var(--dv-mono);letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.dv-fctl{display:flex;gap:8px}
.dv-zooming .dv-cam{transition:transform 1s cubic-bezier(.2,.8,.2,1)!important;transform:scale(1.8)!important;transform-origin:var(--dv-zx,50%) var(--dv-zy,55%)}
.dv-zooming .dv-map,.dv-zooming .dv-strip,.dv-zooming .dv-hero-copy,.dv-zooming .dv-bottom,.dv-zooming .dv-eyebrow,.dv-zooming .dv-index,.dv-zooming .dv-rock,.dv-zooming .dv-prog{opacity:0!important;pointer-events:none}
/* closing panel (replaces the old corporate "Solutions" section) */
.dv-end{position:relative;z-index:11;margin-top:-30vh;background:white;border-radius:22px 22px 0 0;padding:70px 34px 60px;box-shadow:0 -30px 60px rgba(16,41,26,.12)}
.dv-end-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;flex-wrap:wrap}
.dv-end-head h2{font-family:var(--dv-sans);color:var(--dv-ink);font-size:clamp(34px,3.9vw,58px);line-height:1;letter-spacing:-.04em;font-weight:500;max-width:680px;margin:20px 0 0}
.dv-end-head p{max-width:380px;color:#4a5a4f;font-size:15px;line-height:1.5;margin:0}
.dv-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:48px}
.dv-step{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid #e1e7df;border-radius:12px;padding:20px;background:#f6f7f4;transition:transform .3s,background .3s;min-height:170px}
.dv-step:hover,.dv-step:focus-visible{transform:translateY(-3px);background:#eef5df}
.dv-step span{font:10px var(--dv-mono);letter-spacing:.14em;text-transform:uppercase;color:#4f8a12}
.dv-step b{font-size:20px;font-weight:500;letter-spacing:-.02em}
.dv-step small{color:#4a5a4f;font-size:13px;line-height:1.5}
.dv-credits{margin-top:40px;font:10px/1.7 var(--dv-mono);color:#5d6b61}
.dv-credits a{text-decoration:underline;text-underline-offset:3px}
.dv-credits summary{cursor:pointer;letter-spacing:.12em;text-transform:uppercase}
.dv-credits ul{columns:2;margin:12px 0 0;padding-left:18px}
@media(max-width:1000px){.dv-place{font-size:8px;padding:5px 6px}.dv-dot{width:18px;height:18px}.dv-map{left:2%;right:2%}.dv-temp{width:36vw}.dv-steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
 .dv-hero-copy{top:11vh;padding:0 15px}.dv-hero-copy h1{font-size:clamp(40px,8vw,64px);line-height:.96}.dv-line{white-space:normal}
 .dv-eyebrow{left:18px;top:30%;font-size:8px}.dv-index{right:18px;top:30%;font-size:8px}
 .dv-map{left:0;right:0;top:36%;height:40%}.dv-label{gap:0;padding:8px;transform:translate(-16px,-50%)}.dv-label:hover,.dv-label:focus-visible{transform:translate(-16px,-50%) scale(1.08)}.dv-dot{width:20px;height:20px;font-size:16px}.dv-place{display:none}
 .dv-strip{position:absolute;left:18px;right:18px;bottom:138px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0}.dv-strip::-webkit-scrollbar{display:none}
 .dv-strip button{flex:none;border:1px solid rgba(255,255,255,.7);background:rgba(246,248,245,.86);backdrop-filter:blur(8px);border-radius:3px;padding:9px 10px;font:500 9px var(--dv-mono);letter-spacing:.04em;text-transform:uppercase}
 .dv-bottom{left:18px;right:18px;bottom:24px;display:block}.dv-caption{font-size:9px;line-height:1.6;margin-bottom:18px}.dv-explore{justify-content:flex-end;font-size:9px}
 .dv-rk1{width:16vw}.dv-rk3{width:30vw;top:70%}
 .dv-cred{left:18px;top:11vh;max-width:80vw}.dv-card{left:18px;top:auto;bottom:6vh;width:46%}.dv-feats{right:18px;top:auto;bottom:6vh;width:45vw}.dv-feat{font-size:9px;grid-template-columns:23px 1fr;letter-spacing:.05em}.dv-feat b{display:none}
 .dv-focus.open{overflow-y:auto}.dv-focus-img,.dv-shade{position:fixed;inset:0}
 .dv-focus-content{position:relative;left:auto;top:auto;max-width:none;margin:84px 6% 22px;z-index:1}.dv-focus-content h2{font-size:clamp(40px,11vw,60px);margin:13px 0 8px}.dv-focus-content h3{font-size:17px}.dv-focus-content p{font-size:13px;margin-top:10px;max-width:92%}
 .dv-temp{position:relative;right:auto;top:auto;transform:none;width:auto;padding:18px;margin:0 6%;z-index:1}.dv-temp h4{font-size:19px;margin:9px 0 2px}.dv-graph{margin:16px 0 3px}.dv-graph svg{height:80px}.dv-temp-foot{margin-top:13px;padding-top:10px}
 .dv-focus-bottom{position:sticky;bottom:0;left:auto;right:auto;margin-top:24px;padding:12px 6%;z-index:2;background:linear-gradient(transparent,rgba(9,25,16,.82))}.dv-pos{display:none}.dv-back,.dv-next{font-size:9px;padding:11px}
 .dv-end{padding:50px 18px 50px}.dv-steps{grid-template-columns:1fr}.dv-credits ul{columns:1}
}

/* ---------- Trend Detective look: same palette, fonts and panels as /static/lens/ ---------- */
:root{--ink:#173b37;--green:#2e7a68;--lime:#c8f169;--paper:#fbfaf5;--muted:#5d7069;--line:#d6ddd3;--dark:#173b37;--mint:#cfe0bf;--teal:#2e7a68;--warm:#e0832f;
 --serif:"Young Serif",Georgia,"Noto Serif SC",serif;--sans:"Hanken Grotesk",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
body{font:15px var(--sans);background:#e9eee6 url(../img/sky.webp) center top/cover fixed;color:var(--ink)}
main{background:linear-gradient(180deg,rgba(251,250,245,.0),rgba(251,250,245,.72) 260px,rgba(251,250,245,.9))}
main:has(.dv){background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--lime)}
header{height:auto;min-height:68px;padding:12px 28px;background:rgba(251,250,245,.86);backdrop-filter:blur(12px);color:var(--ink);border-bottom:1px solid var(--line);position:relative;z-index:40}
.brand{font-family:var(--sans);font-weight:700;font-size:19px;letter-spacing:-.3px;gap:8px;color:var(--ink)}
.brand-icon{font-size:0;width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);display:inline-block}
.brand-lab{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--teal);border-left:1px solid var(--line);text-transform:none}
nav a{font-size:13px;font-weight:600;color:var(--muted);padding:7px 11px;border-radius:999px}
nav a.active,nav a:hover{color:#1d3a0e;background:var(--lime)}
nav{gap:6px}
.header-cta{font-size:13px;font-weight:600;border:1px solid var(--line);background:rgba(251,250,245,.9);color:var(--ink);border-radius:999px;padding:9px 14px}
.header-cta span{margin:0 6px 0 0;color:var(--teal)}
.eyebrow{text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;color:var(--teal)}
.eyebrow:before{display:none}
.page-title,.section h2,.hero h1,.panel h3,.print-report h1{font-family:var(--serif)!important;font-weight:400;letter-spacing:-.5px}
.page-top .page-title{font-size:clamp(28px,3.4vw,44px)}
.page-top p{font-size:14px}
.pill{background:rgba(251,250,245,.9);border-color:var(--line);font-size:12px;font-weight:600}
.pill:before{background:var(--teal)}
.button{border-radius:999px;background:var(--ink);font-weight:600}
.button:hover{background:#0f2b28}
.button.light{background:var(--lime);color:#1d3a0e}
.panel,.under-map>div{background:rgba(251,250,245,.92);border-color:var(--line);border-radius:22px;box-shadow:0 20px 50px rgba(23,59,55,.08)}
.notice{background:#eef4e6;border-color:#cfe0bf;color:#3d5a45;border-radius:12px}
.segmented button.active,.timeline button{background:var(--ink)}
.loading{font-family:var(--serif)}
footer{background:rgba(251,250,245,.86);color:var(--muted);font-size:12px}
footer .brand{color:var(--ink);font-size:16px}
/* Discover in the same voice: serif headings, sans labels, Trend Detective lime */
